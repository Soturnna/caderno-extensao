name: Testar e empacotar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: caderno-extensao-chrome
          path: .output/*-chrome.zip
